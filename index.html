<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Telemedicine v1</title>
</head>
<body>
  <h1>Telemedicine System - v1</h1>
  <h2>Book a Visit</h2>
  <form>
    <label>Patient name:</label>
    <input type="text" required>
    <label>Visit date:</label>
    <input type="date" required>
    <button type="submit">Schedule Visit</button>
  </form>
  <p>Version 1: Basic visit scheduling interface.</p>

<section id="history">
  <h2>Visit History</h2>
  <p>View your previous visits.</p>
  <ul>
    <li>General consultation — Sample visit</li>
    <li>Follow-up visit — Sample visit</li>
  </ul>
</section>


<section id="notes">
  <h2>Consultation Notes</h2>
  <label for="consultation-notes">Enter notes:</label>
  <br>
  <textarea id="consultation-notes" rows="5"
    placeholder="Enter consultation notes here..."></textarea>
  <br>
  <button type="button"
    onclick="document.getElementById('notes-status').textContent = 'Notes entered in this demo.'">
    Save Notes
  </button>
  <p id="notes-status"></p>
</section>


</body>

</html>
